name: Scraping de precios (diario)

# Corre todos los días a las 12:00 UTC (= 07:00 Lima)
# También permite correrlo manualmente desde la pestaña Actions
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para commitear los CSVs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scrapers
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TZ: America/Lima
        run: python scrape_all.py

      - name: Commit & push histórico
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico_*.csv
          # Si no hay cambios, no hacer commit (no fallar)
          git diff --quiet --cached || git commit -m "data: snapshot $(date -u +%Y-%m-%d_%H:%M)"
          git push

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 90
